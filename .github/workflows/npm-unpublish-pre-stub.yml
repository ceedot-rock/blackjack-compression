name: npm unpublish pre-stub versions
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UNPUBLISH to confirm'
        required: true
jobs:
  unpublish:
    if: github.event.inputs.confirm == 'UNPUBLISH'
    runs-on: ubuntu-latest
    steps:
      - name: Unpublish all pre-stub versions (keep 1.4.0+ stub)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > ~/.npmrc
          for v in 1.0.0 1.0.1 1.0.2 1.1.0 1.1.1 1.2.0 1.2.1 1.2.2 1.3.0 1.3.1 1.3.2 1.3.3 1.3.4 1.3.5 1.3.6; do
            echo "Unpublish blackjack-compression@$v"
            npm unpublish "blackjack-compression@$v" --force || true
          done
          npm view blackjack-compression versions --json || true
